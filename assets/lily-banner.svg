<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Jessy banner with lilies" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b10"/>
      <stop offset="1" stop-color="#3a1620"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8888f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#e8888f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-66">
      <stop offset="0" stop-color="#c9697a"/>
      <stop offset="0.45" stop-color="#f0a3aa"/>
      <stop offset="1" stop-color="#fde4e4"/>
    </linearGradient>

    <g id="petal">
      <path d="M0,0 C-15,-14 -18,-44 0,-66 C18,-44 15,-14 0,0 Z" fill="url(#pg)"/>
      <path d="M0,-6 L0,-54" stroke="#c9697a" stroke-width="1" opacity="0.6" fill="none"/>
      <g fill="#b4545f" opacity="0.7">
        <circle cx="-3" cy="-18" r="1.2"/><circle cx="4" cy="-24" r="1.2"/>
        <circle cx="-4" cy="-31" r="1.1"/><circle cx="3" cy="-12" r="1"/>
        <circle cx="2" cy="-38" r="1"/>
      </g>
    </g>

    <g id="lily">
      <g>
        <use href="#petal" transform="rotate(0)"/>
        <use href="#petal" transform="rotate(120)"/>
        <use href="#petal" transform="rotate(240)"/>
      </g>
      <g transform="scale(0.9)">
        <use href="#petal" transform="rotate(60)"/>
        <use href="#petal" transform="rotate(180)"/>
        <use href="#petal" transform="rotate(300)"/>
      </g>
      <circle r="5" fill="#8f3b47"/>
      <g stroke="#e8a3a8" stroke-width="1.2" fill="none">
        <line x1="0" y1="0" x2="8.9" y2="-24.4"/>
        <line x1="0" y1="0" x2="25.6" y2="-4.5"/>
        <line x1="0" y1="0" x2="16.7" y2="19.9"/>
        <line x1="0" y1="0" x2="-8.9" y2="24.4"/>
        <line x1="0" y1="0" x2="-25.6" y2="4.5"/>
        <line x1="0" y1="0" x2="-16.7" y2="-19.9"/>
      </g>
      <g fill="#f2c879">
        <ellipse cx="8.9" cy="-24.4" rx="2" ry="5" transform="rotate(20 8.9 -24.4)"/>
        <ellipse cx="25.6" cy="-4.5" rx="2" ry="5" transform="rotate(80 25.6 -4.5)"/>
        <ellipse cx="16.7" cy="19.9" rx="2" ry="5" transform="rotate(140 16.7 19.9)"/>
        <ellipse cx="-8.9" cy="24.4" rx="2" ry="5" transform="rotate(200 -8.9 24.4)"/>
        <ellipse cx="-25.6" cy="4.5" rx="2" ry="5" transform="rotate(260 -25.6 4.5)"/>
        <ellipse cx="-16.7" cy="-19.9" rx="2" ry="5" transform="rotate(320 -16.7 -19.9)"/>
      </g>
    </g>

    <path id="fallen" d="M0,0 C-4,-4 -5,-12 0,-18 C5,-12 4,-4 0,0 Z"/>
  </defs>

  <rect width="900" height="280" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="278" rx="17" fill="none" stroke="#6b2c3a" stroke-width="1.5"/>

  <!-- soft glows behind the lilies -->
  <circle cx="130" cy="140" r="150" fill="url(#glow)"/>
  <circle cx="770" cy="140" r="150" fill="url(#glow)"/>

  <!-- left lilies -->
  <g transform="translate(130,140) scale(1.3)">
    <g>
      <use href="#lily"/>
      <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(60,236) scale(0.6)" opacity="0.9">
    <g>
      <use href="#lily"/>
      <animateTransform attributeName="transform" type="rotate" values="8;-8;8" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- right lilies -->
  <g transform="translate(770,140) scale(1.3)">
    <g>
      <use href="#lily"/>
      <animateTransform attributeName="transform" type="rotate" values="5;-5;5" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(842,50) scale(0.55)" opacity="0.9">
    <g>
      <use href="#lily"/>
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- drifting petals -->
  <g fill="#f4b5bb">
    <use href="#fallen" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" rotate="auto" path="M300,-20 C340,70 260,150 320,300"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.8;1" dur="12s" repeatCount="indefinite"/>
    </use>
    <use href="#fallen" opacity="0">
      <animateMotion dur="14s" begin="3s" repeatCount="indefinite" rotate="auto" path="M600,-20 C560,80 650,160 590,300"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.8;1" dur="14s" begin="3s" repeatCount="indefinite"/>
    </use>
    <use href="#fallen" opacity="0">
      <animateMotion dur="10s" begin="6s" repeatCount="indefinite" rotate="auto" path="M450,-20 C500,60 400,160 470,300"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.8;1" dur="10s" begin="6s" repeatCount="indefinite"/>
    </use>
    <use href="#fallen" opacity="0">
      <animateMotion dur="13s" begin="8s" repeatCount="indefinite" rotate="auto" path="M240,-20 C200,90 290,170 230,300"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.8;1" dur="13s" begin="8s" repeatCount="indefinite"/>
    </use>
    <use href="#fallen" opacity="0">
      <animateMotion dur="15s" begin="1s" repeatCount="indefinite" rotate="auto" path="M680,-20 C720,70 640,150 700,300"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.8;1" dur="15s" begin="1s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- text -->
<text x="460" y="95"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="45"
      letter-spacing="5"
      fill="#e9bbbb">
  <tspan x="460" dy="0">SORN</tspan>
  <tspan x="460" dy="45">SOVANNPHAKRAKNY</tspan>
</text>
  <line x1="390" y1="156" x2="510" y2="156" stroke="#e8888f" stroke-width="1" opacity="0.7"/>
  <text x="450" y="182" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" letter-spacing="3" fill="#e8a3a8">DEVELOPER // LOGISTICS OPERATIONS // PHNOM PENH</text>
  <text x="450" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" letter-spacing="2" fill="#b58a8f">open to internships and junior roles</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
