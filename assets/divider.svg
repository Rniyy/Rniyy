  <line x1="40" y1="28" x2="400" y2="28" stroke="url(#fadeL)" stroke-width="1.5"/>
  <line x1="500" y1="28" x2="860" y2="28" stroke="url(#fadeR)" stroke-width="1.5"/>
  <circle cx="414" cy="28" r="2.5" fill="#e8888f">
