          <ellipse cx="25.6" cy="-4.5" rx="2.4" ry="5.5" transform="rotate(80 25.6 -4.5)"/>
          <ellipse cx="16.7" cy="19.9" rx="2.4" ry="5.5" transform="rotate(140 16.7 19.9)"/>
          <ellipse cx="-8.9" cy="24.4" rx="2.4" ry="5.5" transform="rotate(200 -8.9 24.4)"/>
          <ellipse cx="-25.6" cy="4.5" rx="2.4" ry="5.5" transform="rotate(260 -25.6 4.5)"/>
          <ellipse cx="-16.7" cy="-19.9" rx="2.4" ry="5.5" transform="rotate(320 -16.7 -19.9)"/>
