          <line x1="0" y1="0" x2="16.7" y2="19.9"/><line x1="0" y1="0" x2="-8.9" y2="24.4"/>
          <line x1="0" y1="0" x2="-25.6" y2="4.5"/><line x1="0" y1="0" x2="-16.7" y2="-19.9"/>
        </g>
        <g fill="#f2c879">
