<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="900" height="56" role="img" aria-label="Lily divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8888f" stop-opacity="0"/>
      <stop offset="1" stop-color="#e8888f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8888f" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e8888f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="-66">
      <stop offset="0" stop-color="#c9697a"/>
      <stop offset="0.45" stop-color="#f0a3aa"/>
      <stop offset="1" stop-color="#fde4e4"/>
