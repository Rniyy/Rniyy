      <g transform="rotate(120)"><g><use href="#petal"/><animateTransform attributeName="transform" type="scale" values="0.3;1;1;0.3" keyTimes="0;0.35;0.75;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" dur="9s" begin="0.15s" repeatCount="indefinite"/></g></g>
      <g transform="rotate(240)"><g><use href="#petal"/><animateTransform attributeName="transform" type="scale" values="0.3;1;1;0.3" keyTimes="0;0.35;0.75;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" dur="9s" begin="0.3s" repeatCount="indefinite"/></g></g>
      <g transform="rotate(60) scale(0.9)"><g><use href="#petal"/><animateTransform attributeName="transform" type="scale" values="0.3;1;1;0.3" keyTimes="0;0.35;0.75;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" dur="9s" begin="0.45s" repeatCount="indefinite"/></g></g>
