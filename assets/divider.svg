      <g transform="rotate(300) scale(0.9)"><g><use href="#petal"/><animateTransform attributeName="transform" type="scale" values="0.3;1;1;0.3" keyTimes="0;0.35;0.75;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1" dur="9s" begin="0.75s" repeatCount="indefinite"/></g></g>
